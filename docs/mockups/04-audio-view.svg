<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1810"/>
      <stop offset="100%" stop-color="#080e0a"/>
    </linearGradient>
    <linearGradient id="volFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5a2a"/>
      <stop offset="100%" stop-color="#3a9a4a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- Status bar -->
  <rect x="0" y="0" width="800" height="36" fill="#060c08"/>
  <line x1="0" y1="36" x2="800" y2="36" stroke="#1a3a1a" stroke-width="1"/>
  <circle cx="20" cy="18" r="4" fill="#00d4ff"/>
  <text x="32" y="22" fill="#556655" font-family="sans-serif" font-size="11">GPS lock</text>
  <text x="700" y="22" fill="#556655" font-family="sans-serif" font-size="12" text-anchor="end">74°F</text>
  <text x="780" y="22" fill="#778877" font-family="sans-serif" font-size="13" text-anchor="end" font-weight="bold">4:12 PM</text>

  <!-- Tab bar -->
  <rect x="0" y="370" width="800" height="50" fill="#080e0a"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#1a3a1a" stroke-width="1"/>
  <text x="100" y="398" fill="#445544" font-family="sans-serif" font-size="11" text-anchor="middle">▲ NAV</text>
  <line x1="200" y1="375" x2="200" y2="415" stroke="#1a3a1a" stroke-width="1"/>
  <text x="300" y="398" fill="#445544" font-family="sans-serif" font-size="11" text-anchor="middle">❄ CLIMATE</text>
  <line x1="400" y1="375" x2="400" y2="415" stroke="#1a3a1a" stroke-width="1"/>
  <rect x="400" y="370" width="200" height="50" fill="#0f1a12"/>
  <line x1="400" y1="370" x2="600" y2="370" stroke="#00d4ff" stroke-width="3"/>
  <text x="500" y="398" fill="#00d4ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">♪ AUDIO</text>
  <line x1="600" y1="375" x2="600" y2="415" stroke="#1a3a1a" stroke-width="1"/>
  <text x="700" y="398" fill="#445544" font-family="sans-serif" font-size="11" text-anchor="middle">✆ PHONE</text>

  <!-- ===== SOURCE SELECTOR ===== -->
  <!-- BT (active) -->
  <rect x="30" y="48" width="100" height="36" rx="4" fill="#1a4a2a" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="80" y="71" fill="#00d4ff" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">BT</text>

  <rect x="144" y="48" width="100" height="36" rx="4" fill="#0f1f12" stroke="#2a4a2a" stroke-width="1"/>
  <text x="194" y="71" fill="#445544" font-family="sans-serif" font-size="14" text-anchor="middle">FM</text>

  <rect x="258" y="48" width="100" height="36" rx="4" fill="#0f1f12" stroke="#2a4a2a" stroke-width="1"/>
  <text x="308" y="71" fill="#445544" font-family="sans-serif" font-size="14" text-anchor="middle">AM</text>

  <rect x="372" y="48" width="100" height="36" rx="4" fill="#0f1f12" stroke="#2a4a2a" stroke-width="1"/>
  <text x="422" y="71" fill="#445544" font-family="sans-serif" font-size="14" text-anchor="middle">SXM</text>

  <rect x="486" y="48" width="100" height="36" rx="4" fill="#0f1f12" stroke="#2a4a2a" stroke-width="1"/>
  <text x="536" y="71" fill="#445544" font-family="sans-serif" font-size="14" text-anchor="middle">AUX</text>

  <line x1="30" y1="100" x2="770" y2="100" stroke="#1a3a1a" stroke-width="1"/>

  <!-- ===== BT CONTENT ===== -->

  <!-- BT connection status -->
  <circle cx="80" cy="138" r="18" fill="#0d1f12" stroke="#3a7a3a" stroke-width="2"/>
  <text x="80" y="145" fill="#4a8a4a" font-family="sans-serif" font-size="16" text-anchor="middle">⦿</text>
  <text x="110" y="132" fill="#aaddaa" font-family="sans-serif" font-size="13">Connected</text>
  <text x="110" y="150" fill="#556655" font-family="sans-serif" font-size="11">Phone (Connected)</text>

  <!-- Album art placeholder -->
  <rect x="60" y="168" width="120" height="120" rx="6" fill="#0d1f10" stroke="#2a4a2a" stroke-width="1.5"/>
  <text x="120" y="235" fill="#2a4a2a" font-family="sans-serif" font-size="36" text-anchor="middle">♪</text>

  <!-- Track info -->
  <text x="210" y="190" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Somebody That I Used</text>
  <text x="210" y="213" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">to Know</text>
  <text x="210" y="238" fill="#778877" font-family="sans-serif" font-size="14">Gotye feat. Kimbra</text>
  <text x="210" y="258" fill="#445544" font-family="sans-serif" font-size="12">Making Mirrors</text>

  <!-- Progress bar -->
  <rect x="60" y="300" width="680" height="6" rx="3" fill="#1a2a1a"/>
  <rect x="60" y="300" width="280" height="6" rx="3" fill="#3a8a3a"/>
  <circle cx="340" cy="303" r="7" fill="#ffffff" stroke="#3a8a3a" stroke-width="2"/>
  <text x="60" y="320" fill="#445544" font-family="sans-serif" font-size="11">1:47</text>
  <text x="740" y="320" fill="#445544" font-family="sans-serif" font-size="11" text-anchor="end">4:04</text>

  <!-- Playback controls -->
  <!-- Prev -->
  <rect x="230" y="330" width="60" height="30" rx="4" fill="#0f1f12" stroke="#2a4a2a" stroke-width="1"/>
  <text x="260" y="350" fill="#778877" font-family="sans-serif" font-size="16" text-anchor="middle">⏮</text>

  <!-- Play/Pause (playing) -->
  <rect x="302" y="325" width="70" height="38" rx="4" fill="#1a4a2a" stroke="#3a9a3a" stroke-width="1.5"/>
  <text x="337" y="349" fill="#aaffaa" font-family="sans-serif" font-size="20" text-anchor="middle">⏸</text>

  <!-- Next -->
  <rect x="384" y="330" width="60" height="30" rx="4" fill="#0f1f12" stroke="#2a4a2a" stroke-width="1"/>
  <text x="414" y="350" fill="#778877" font-family="sans-serif" font-size="16" text-anchor="middle">⏭</text>

  <!-- Volume section -->
  <line x1="500" y1="110" x2="500" y2="365" stroke="#1a3a1a" stroke-width="1"/>

  <text x="640" y="130" fill="#778877" font-family="sans-serif" font-size="12" text-anchor="middle">VOLUME</text>

  <!-- Volume slider -->
  <rect x="560" y="145" width="160" height="8" rx="4" fill="#1a2a1a"/>
  <rect x="560" y="145" width="104" height="8" rx="4" fill="url(#volFill)"/>
  <circle cx="664" cy="149" r="10" fill="#ffffff" stroke="#3a8a3a" stroke-width="2"/>
  <text x="640" y="173" fill="#aaddaa" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">65%</text>

  <!-- Mute button -->
  <rect x="600" y="195" width="80" height="32" rx="4" fill="#0f1f12" stroke="#2a4a2a" stroke-width="1"/>
  <text x="640" y="216" fill="#445544" font-family="sans-serif" font-size="13" text-anchor="middle">🔇 MUTE</text>

  <!-- Bose badge -->
  <text x="640" y="285" fill="#334433" font-family="sans-serif" font-size="11" text-anchor="middle">BOSE® PERSONAL PLUS</text>
  <rect x="575" y="265" width="130" height="24" rx="3" fill="none" stroke="#223322" stroke-width="1"/>
</svg>
