<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1810"/>
      <stop offset="100%" stop-color="#080e0a"/>
    </linearGradient>
    <linearGradient id="callGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5a1a"/>
      <stop offset="100%" stop-color="#2a8a2a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- Status bar -->
  <rect x="0" y="0" width="800" height="36" fill="#060c08"/>
  <line x1="0" y1="36" x2="800" y2="36" stroke="#1a3a1a" stroke-width="1"/>
  <circle cx="20" cy="18" r="4" fill="#00d4ff"/>
  <text x="32" y="22" fill="#556655" font-family="sans-serif" font-size="11">GPS lock</text>
  <!-- Call duration in status bar -->
  <text x="400" y="22" fill="#aaffaa" font-family="sans-serif" font-size="12" text-anchor="middle">● Active call  3:42</text>
  <text x="780" y="22" fill="#778877" font-family="sans-serif" font-size="13" text-anchor="end" font-weight="bold">4:12 PM</text>

  <!-- Tab bar -->
  <rect x="0" y="370" width="800" height="50" fill="#080e0a"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#1a3a1a" stroke-width="1"/>
  <text x="100" y="398" fill="#445544" font-family="sans-serif" font-size="11" text-anchor="middle">▲ NAV</text>
  <line x1="200" y1="375" x2="200" y2="415" stroke="#1a3a1a" stroke-width="1"/>
  <text x="300" y="398" fill="#445544" font-family="sans-serif" font-size="11" text-anchor="middle">❄ CLIMATE</text>
  <line x1="400" y1="375" x2="400" y2="415" stroke="#1a3a1a" stroke-width="1"/>
  <text x="500" y="398" fill="#445544" font-family="sans-serif" font-size="11" text-anchor="middle">♪ AUDIO</text>
  <line x1="600" y1="375" x2="600" y2="415" stroke="#1a3a1a" stroke-width="1"/>
  <rect x="600" y="370" width="200" height="50" fill="#0f1a12"/>
  <line x1="600" y1="370" x2="800" y2="370" stroke="#00d4ff" stroke-width="3"/>
  <text x="700" y="398" fill="#00d4ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✆ PHONE</text>

  <!-- ===== ACTIVE CALL VIEW ===== -->

  <!-- Call pulse ring -->
  <circle cx="200" cy="195" r="62" fill="none" stroke="#1a5a1a" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="195" r="48" fill="none" stroke="#2a8a2a" stroke-width="1.5" opacity="0.7"/>
  <!-- Avatar circle -->
  <circle cx="200" cy="195" r="38" fill="#0d1f10" stroke="#3a7a3a" stroke-width="2"/>
  <text x="200" y="205" fill="#4a8a4a" font-family="sans-serif" font-size="32" text-anchor="middle">✆</text>

  <!-- Caller info -->
  <text x="200" y="270" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">KellyAnne</text>
  <text x="200" y="295" fill="#778877" font-family="sans-serif" font-size="14" text-anchor="middle">Mobile · 3:42</text>

  <!-- Divider -->
  <line x1="340" y1="52" x2="340" y2="365" stroke="#1a3a1a" stroke-width="1"/>

  <!-- ===== CALL CONTROLS (right side) ===== -->

  <!-- Mute button -->
  <rect x="390" y="60" width="110" height="68" rx="6" fill="#0f1f12" stroke="#2a4a2a" stroke-width="1.5"/>
  <text x="445" y="92" fill="#778877" font-family="sans-serif" font-size="22" text-anchor="middle">🎙</text>
  <text x="445" y="116" fill="#556655" font-family="sans-serif" font-size="12" text-anchor="middle">MUTE</text>

  <!-- Keypad button -->
  <rect x="520" y="60" width="110" height="68" rx="6" fill="#0f1f12" stroke="#2a4a2a" stroke-width="1.5"/>
  <text x="575" y="92" fill="#778877" font-family="sans-serif" font-size="20" text-anchor="middle">⌨</text>
  <text x="575" y="116" fill="#556655" font-family="sans-serif" font-size="12" text-anchor="middle">KEYPAD</text>

  <!-- Volume up/down -->
  <rect x="650" y="60" width="110" height="68" rx="6" fill="#0f1f12" stroke="#2a4a2a" stroke-width="1.5"/>
  <text x="705" y="88" fill="#778877" font-family="sans-serif" font-size="18" text-anchor="middle">🔊</text>
  <text x="705" y="108" fill="#aaddaa" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">65</text>
  <text x="705" y="122" fill="#445544" font-family="sans-serif" font-size="10" text-anchor="middle">volume</text>

  <!-- End call button (prominent) -->
  <rect x="390" y="250" width="370" height="72" rx="8" fill="#6a0a0a" stroke="#aa2a2a" stroke-width="2"/>
  <text x="575" y="285" fill="#ffaaaa" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">✆  END CALL</text>
  <text x="575" y="308" fill="#aa6666" font-family="sans-serif" font-size="12" text-anchor="middle">tap to hang up</text>

  <!-- DTMF keypad overlay (collapsed, show hint) -->
  <rect x="390" y="150" width="370" height="88" rx="4" fill="#0a1508" stroke="#1a3a1a" stroke-width="1"/>
  <!-- Mini keypad 3x3 grid hint -->
  <text x="575" y="170" fill="#334433" font-family="sans-serif" font-size="11" text-anchor="middle">─── DTMF KEYPAD ───</text>
  <g fill="#223322" font-family="sans-serif" font-size="13" text-anchor="middle">
    <text x="440" y="195">1</text><text x="575" y="195">2</text><text x="710" y="195">3</text>
    <text x="440" y="218">4</text><text x="575" y="218">5</text><text x="710" y="218">6</text>
  </g>
  <text x="575" y="232" fill="#223322" font-family="sans-serif" font-size="10" text-anchor="middle">(tap KEYPAD to expand)</text>
</svg>
