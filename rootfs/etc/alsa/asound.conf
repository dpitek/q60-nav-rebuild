# ALSA config for Q60 DCU (Clarion QY5092)
# Intel HDA output → Bose 11-channel DSP amp via I2S/SPDIF
# Bluetooth A2DP sink: bluez_sink (managed by PulseAudio or pipewire)

# Default device: HDA Intel (internal DAC → Bose amp)
defaults.pcm.card 0
defaults.ctl.card 0

# PCM aliases
pcm.!default {
    type hw
    card 0
    device 0
}

# Bose amp: full-range output (DSP handles crossover)
# The Bose amp receives PCM and applies its own EQ/crossover internally
pcm.bose {
    type hw
    card 0
    device 0
    format S16_LE
    rate 44100
    channels 2
}

# Software mixer — allows multiple apps to share the DAC
pcm.dmix_bose {
    type dmix
    ipc_key 1024
    slave {
        pcm "bose"
        rate 44100
        periods 4
        period_size 1024
    }
}

# Bluetooth A2DP sink (dynamic — created by BlueZ/PipeWire)
# q60nav uses ALSA device "bluez_sink.auto" when BT source active
# Handled by AudioService::setSource(Bluetooth) → PULSE_SINK env var
